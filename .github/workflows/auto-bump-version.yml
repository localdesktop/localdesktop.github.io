name: Manage releases from PR labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - closed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-pr:
    name: Classify PR
    runs-on: ubuntu-latest
    outputs:
      gh_pages_only: ${{ steps.classify.outputs.gh_pages_only }}

    steps:
      - name: Classify PR
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const ghPagesOnly =
              files.length > 0 &&
              files.every((file) => file.filename.startsWith("gh-pages/"));

            core.setOutput("gh_pages_only", ghPagesOnly ? "true" : "false");

  prepare-release:
    name: Prepare Release
    needs: classify-pr
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Skip gh-pages-only PR
        if: needs.classify-pr.outputs.gh_pages_only == 'true'
        run: echo "Release workflow skipped for gh-pages-only PR."

      - name: Resolve release label
        if: needs.classify-pr.outputs.gh_pages_only != 'true'
        id: release
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          python <<'PY'
          import json
          import os

          release_labels = {
              'release:breaking': 'major',
              'release:feature': 'minor',
              'release:bugfix': 'patch',
              'release:patch': 'patch',
              'release:improvement': 'patch',
              'release:optimisation': 'patch',
              'release:docs': '',
          }
          labels = {item['name'] for item in json.loads(os.environ['LABELS_JSON'])}
          selected = [label for label in release_labels if label in labels]

          if len(selected) != 1:
              print('PRs to main must have exactly one release label:')
              print('  - release:breaking     (major)')
              print('  - release:feature      (minor)')
              print('  - release:bugfix       (patch)')
              print('  - release:patch        (patch)')
              print('  - release:improvement  (patch)')
              print('  - release:optimisation (patch)')
              print('  - release:docs         (no version bump / no app release)')
              print(f'Found: {selected or "none"}')
              raise SystemExit(1)

          label = selected[0]
          level = release_labels[label]
          print(f'Using release label: {label}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'label={label}\n')
              f.write(f'level={level}\n')
          PY

      - name: Require same-repo branch
        if: needs.classify-pr.outputs.gh_pages_only != 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Release version automation can only push to branches in ${GITHUB_REPOSITORY}."
          echo "::error::Please add the Cargo.toml/Cargo.lock version bump manually for fork PRs."
          exit 1

      - name: Check out PR branch
        if: needs.classify-pr.outputs.gh_pages_only != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Sync release version commit
        if: needs.classify-pr.outputs.gh_pages_only != 'true'
        env:
          BUMP_LEVEL: ${{ steps.release.outputs.level }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "main:refs/remotes/origin/main" --tags --force

          EXPECTED_VERSION=$(python <<'PY'
          import os
          import re
          import subprocess

          def parse_version(raw):
              match = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)', raw.strip())
              if not match:
                  return None
              return tuple(map(int, match.groups()))

          def version_str(version):
              return '.'.join(map(str, version))

          def bump(version, level):
              major, minor, patch = version
              if level == 'major':
                  return (major + 1, 0, 0)
              if level == 'minor':
                  return (major, minor + 1, 0)
              return (major, minor, patch + 1)

          main_manifest = subprocess.run(
              ['git', 'show', 'origin/main:Cargo.toml'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          match = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', main_manifest, re.M)
          if not match:
              raise SystemExit('Could not find version in Cargo.toml on main')

          main_version = tuple(map(int, match.groups()))
          latest_tag_version = None
          tags = subprocess.run(
              ['git', 'tag', '--list', 'v*.*.*', '--sort=-v:refname'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          for tag in tags:
              parsed = parse_version(tag)
              if parsed is not None:
                  latest_tag_version = parsed
                  break

          base_version = max(main_version, latest_tag_version or main_version)
          level = os.environ['BUMP_LEVEL']
          expected_version = bump(base_version, level) if level else base_version
          print(version_str(expected_version))
          PY
          )
          echo "Expected version: ${EXPECTED_VERSION}"
          export EXPECTED_VERSION

          python <<'PY'
          import os
          import re
          from pathlib import Path

          expected_version = os.environ['EXPECTED_VERSION']

          cargo_toml = Path('Cargo.toml')
          cargo_toml_text = cargo_toml.read_text(encoding='utf-8')
          cargo_toml_text, toml_replacements = re.subn(
              r'^version\s*=\s*"\d+\.\d+\.\d+"',
              f'version = "{expected_version}"',
              cargo_toml_text,
              count=1,
              flags=re.M,
          )
          if toml_replacements != 1:
              raise SystemExit('Failed to update version in Cargo.toml')
          cargo_toml.write_text(cargo_toml_text, encoding='utf-8')

          cargo_lock = Path('Cargo.lock')
          cargo_lock_text = cargo_lock.read_text(encoding='utf-8')
          cargo_lock_text, lock_replacements = re.subn(
              r'(\[\[package\]\]\nname = "localdesktop"\nversion = ")\d+\.\d+\.\d+(")',
              rf'\g<1>{expected_version}\2',
              cargo_lock_text,
              count=1,
          )
          if lock_replacements != 1:
              raise SystemExit('Failed to update localdesktop package version in Cargo.lock')
          cargo_lock.write_text(cargo_lock_text, encoding='utf-8')
          PY

          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "Version files already match v${EXPECTED_VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: set version to v${EXPECTED_VERSION}"
          git push origin "HEAD:${HEAD_REF}"

  tag-release:
    name: Tag Release
    needs: classify-pr
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && needs.classify-pr.outputs.gh_pages_only != 'true' && !contains(github.event.pull_request.labels.*.name, 'release:docs')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Resolve release label
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          python <<'PY'
          import json
          import os

          release_labels = {
              'release:breaking',
              'release:feature',
              'release:bugfix',
              'release:patch',
              'release:improvement',
              'release:optimisation',
          }
          labels = {item['name'] for item in json.loads(os.environ['LABELS_JSON'])}
          selected = [label for label in release_labels if label in labels]

          if len(selected) != 1:
              raise SystemExit(
                  'Merged release PRs must have exactly one non-docs release label.'
              )

          print(f'Using release label: {selected[0]}')
          PY

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Create release tag
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          VERSION=$(python <<'PY'
          import re
          from pathlib import Path

          manifest = Path('Cargo.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"(\d+\.\d+\.\d+)"', manifest, re.M)
          if not match:
              raise SystemExit('Could not find version in Cargo.toml')
          print(match.group(1))
          PY
          )
          TAG="v${VERSION}"

          git fetch origin "+refs/tags/*:refs/tags/*"
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "${TAG}")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
              echo "Tag ${TAG} already points to HEAD."
              exit 0
            fi

            echo "::error::Tag ${TAG} already exists on a different commit."
            exit 1
          fi

          printf '%s\n' "${PR_BODY:-$PR_TITLE}" > "${RUNNER_TEMP}/release-notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -F "${RUNNER_TEMP}/release-notes.md"
          git push origin "refs/tags/${TAG}"
