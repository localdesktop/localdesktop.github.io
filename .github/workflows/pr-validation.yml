name: Pull Request Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-validation

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check host targets
        run: cargo check --locked --all-targets

      - name: Run host tests
        run: cargo test --locked --all-targets

  android:
    name: Android ARM64 debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64-validation
          cache-directories: |
            ~/.cache/x/Android.ndk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends llvm unzip

      - name: Prepare Android NDK r28
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "$HOME/.cache/x/Android.ndk" ]]; then
            echo "Using cached Android.ndk"
            exit 0
          fi

          curl --fail --location --retry 3 \
            --output android-ndk-r28-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip

          toolchain="android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64"
          clang_version="$(find "$toolchain/lib/clang" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          clang="$toolchain/lib/clang/$clang_version"

          mkdir -p Android.ndk
          cp -r "$toolchain/sysroot/usr" Android.ndk/
          cp -r "$clang/lib/linux/aarch64/." Android.ndk/usr/lib/aarch64-linux-android/
          cp -r "$clang/lib/linux/arm/." Android.ndk/usr/lib/arm-linux-androideabi/
          cp -r "$clang/lib/linux/x86_64/." Android.ndk/usr/lib/x86_64-linux-android/
          cp -r "$clang/lib/linux/i386/." Android.ndk/usr/lib/i686-linux-android/

          printf 'INPUT(-lunwind)\n' > Android.ndk/usr/lib/aarch64-linux-android/libgcc.a
          printf 'INPUT(-lunwind)\n' > Android.ndk/usr/lib/arm-linux-androideabi/libgcc.a
          printf 'INPUT(-lunwind)\n' > Android.ndk/usr/lib/x86_64-linux-android/libgcc.a
          printf 'INPUT(-lunwind)\n' > Android.ndk/usr/lib/i686-linux-android/libgcc.a

          mkdir -p "$HOME/.cache/x"
          mv Android.ndk "$HOME/.cache/x/Android.ndk"

      - name: Install patched xbuild
        working-directory: patches/xbuild
        run: cargo install --locked --path xbuild

      - name: Build unsigned debug APK
        run: x build --platform=android --arch=arm64 --format=apk

      - name: List generated APKs
        if: always()
        run: find target/x -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: localdesktop-android-arm64-debug
          path: target/x/**/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
