name: Build APK & AAB
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Build APK · {0}{1}', github.ref_name, inputs.dispatch_id && format(' · {0}', inputs.dispatch_id) || '')
      || github.event_name == 'pull_request' && github.event.pull_request.title
      || format('Release {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      include_debug_apk:
        description: "Also upload the debug APK as an artifact"
        type: boolean
        default: false
      include_aab:
        description: "Also build and upload the AAB as an artifact"
        type: boolean
        default: false
      dispatch_id:
        description: "Correlation id (set by the Local Desktop VS Code extension)"
        type: string
        required: false
        default: ""
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
    branches:
      - main
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  validate-release-label:
    name: Validate Release Label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_build: ${{ steps.classify.outputs.should_build }}

    steps:
      - name: Classify PR
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("should_build", "true");
              return;
            }

            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            // Keep in sync with auto-bump-version.yml and vscode-extension/src/release/exemptPaths.ts
            const NON_APP_PREFIXES = ["gh-pages/", "vscode-extension/", ".vscode/"];
            const NON_APP_FILES = new Set([
              ".mcp.json",
              ".cursor/mcp.json",
              "AGENTS.md",
              "CLAUDE.md",
              ".github/localdesktop-dev.json",
              ".github/workflows/vscode-extension.yml",
            ]);
            const isNonApp = (path) =>
              NON_APP_PREFIXES.some((prefix) => path.startsWith(prefix)) || NON_APP_FILES.has(path);
            const nonAppOnly =
              files.length > 0 &&
              files.every((file) =>
                isNonApp(file.filename) &&
                (!file.previous_filename || isNonApp(file.previous_filename))
              );

            if (nonAppOnly) {
              core.info("Skipping release label validation and APK build for website/tooling-only PR.");
              core.setOutput("should_build", "false");
              return;
            }

            const appReleaseLabels = new Set([
              "release:breaking",
              "release:feature",
              "release:bugfix",
              "release:patch",
              "release:improvement",
              "release:optimisation",
            ]);
            const releaseLabels = new Set([...appReleaseLabels, "release:docs"]);
            const labels = pr.labels.map((label) => label.name);
            const selected = labels.filter((label) => releaseLabels.has(label));
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (selected.length !== 1) {
              core.setFailed(
                `PRs to main must have exactly one release label. Found: ${
                  selected.join(", ") || "none"
                }`
              );
              return;
            }

            const shouldBuild =
              sameRepo &&
              appReleaseLabels.has(selected[0]);

            core.info(`same-repo PR: ${sameRepo}`);
            core.info(`release label: ${selected[0]}`);
            core.info(`build signed APK: ${shouldBuild}`);
            core.setOutput("should_build", shouldBuild ? "true" : "false");

  build:
    needs: validate-release-label
    if: github.event_name != 'pull_request' || needs.validate-release-label.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Extract version
        id: extract_version
        run: echo "version=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        if: github.ref_type == 'tag'
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const tag = process.env.GITHUB_REF_NAME || context.ref.replace(/^refs\/tags\//, "");
            let notes = "";

            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });

              if (ref.data.object.type === "tag") {
                const tagObject = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: ref.data.object.sha,
                });
                notes = (tagObject.data.message || "").trim();
              }
            } catch (error) {
              core.warning(`Could not load release notes from tag ${tag}: ${error.message}`);
            }

            const notesPath = path.join(process.env.RUNNER_TEMP, "release-notes.md");
            fs.writeFileSync(notesPath, notes ? `${notes}\n` : "", "utf8");
            core.setOutput("found", notes ? "true" : "false");
            core.setOutput("path", notesPath);

      - name: Fallback release notes to commit message
        if: github.ref_type == 'tag' && steps.release_notes.outputs.found != 'true'
        run: |
          git log -1 --pretty=%B > "${{ steps.release_notes.outputs.path }}"

      - name: Setup signing keystore
        run: |
          mkdir -p target/x/release/android/gradle/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > target/x/release/android/gradle/app/release-key.jks
          # Verify keystore
          keytool -list -v -keystore target/x/release/android/gradle/app/release-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD"

      - name: Update manifest.yaml to target API 35
        run: |
          sed -i 's/target_sdk_version: 33/target_sdk_version: 35/' manifest.yaml

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Download Android NDK r28 # Xbuild does this automatically, but at the moment it does not yet support NDK r28, and we need it for 16 KB ELF alignment.
        run: |
          curl -o android-ndk-r28-linux.zip https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip android-ndk-r28-linux.zip
          rm android-ndk-r28-linux.zip

      - name: Prepare Android.ndk # Replicate these steps from Xbuild's release workflow, so a fully compatible Android.ndk folder with NDK r28 is available offline in the working directory where Xbuild proceeds.
        run: |
          TOOLCHAIN=android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64
          CLANG_VERSION=$(find "$TOOLCHAIN/lib/clang" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | head -n 1)
          CLANG="$TOOLCHAIN/lib/clang/$CLANG_VERSION"

          mkdir Android.ndk
          cp -r "$TOOLCHAIN/sysroot/usr" Android.ndk/
          cp -r "$CLANG/lib/linux/aarch64"/* Android.ndk/usr/lib/aarch64-linux-android/
          cp -r "$CLANG/lib/linux/arm"/* Android.ndk/usr/lib/arm-linux-androideabi/
          cp -r "$CLANG/lib/linux/x86_64"/* Android.ndk/usr/lib/x86_64-linux-android/
          cp -r "$CLANG/lib/linux/i386"/* Android.ndk/usr/lib/i686-linux-android/

          echo "INPUT(-lunwind)" > Android.ndk/usr/lib/aarch64-linux-android/libgcc.a
          echo "INPUT(-lunwind)" > Android.ndk/usr/lib/arm-linux-androideabi/libgcc.a
          echo "INPUT(-lunwind)" > Android.ndk/usr/lib/x86_64-linux-android/libgcc.a
          echo "INPUT(-lunwind)" > Android.ndk/usr/lib/i686-linux-android/libgcc.a

          mkdir -p ~/.cache/x/
          mv Android.ndk ~/.cache/x/

      - name: Build xbuild
        working-directory: patches/xbuild
        run: cargo install --path xbuild

      - name: Build APK
        run: x build --release --platform=android --arch=arm64 --format=apk

      - name: Rename APK
        run: |
          mv target/x/release/android/gradle/app/build/outputs/apk/debug/app-debug.apk target/x/localdesktop-${{ steps.extract_version.outputs.version }}-debug.apk
          mv target/x/release/android/gradle/app/build/outputs/apk/release/app-release.apk target/x/localdesktop-${{ steps.extract_version.outputs.version }}.apk

      - name: Prepare APK artifacts
        id: apk_artifact
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FALLBACK_REF: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_number) }}
          INCLUDE_DEBUG: ${{ inputs.include_debug_apk && 'true' || 'false' }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          SAFE_REF=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' | cut -c1-60)
          if [ -z "$SAFE_REF" ]; then
            SAFE_REF="$FALLBACK_REF"
          fi
          SHORT_SHA="${HEAD_SHA:0:7}"
          BASE="localdesktop-${VERSION}-${SAFE_REF}-${SHORT_SHA}"
          ARTIFACT_PATH="target/x/${BASE}-release.apk"
          cp "target/x/localdesktop-${VERSION}.apk" "$ARTIFACT_PATH"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"
          if [ "$INCLUDE_DEBUG" = "true" ]; then
            DEBUG_PATH="target/x/${BASE}-debug.apk"
            cp "target/x/localdesktop-${VERSION}-debug.apk" "$DEBUG_PATH"
            echo "debug_path=${DEBUG_PATH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release APK
        if: steps.apk_artifact.outputs.path != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk_artifact.outputs.path }}
          if-no-files-found: error
          archive: false

      - name: Upload debug APK
        if: steps.apk_artifact.outputs.debug_path != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk_artifact.outputs.debug_path }}
          if-no-files-found: error
          archive: false

      - name: Leave the keyboard accessibility service out of the Play build
        if: github.ref_type == 'tag' || inputs.include_aab
        run: |
          awk '/^      services:$/ {skip=1; next} skip { match($0, /^ */); if (RLENGTH > 6) next; skip=0 } 1' manifest.yaml > manifest.play.yaml
          mv manifest.play.yaml manifest.yaml
          rm -r src/android/java

      - name: Build AAB
        if: github.ref_type == 'tag' || inputs.include_aab
        run: x build --release --platform=android --arch=arm64 --format=aab

      - name: Rename AAB
        if: github.ref_type == 'tag' || inputs.include_aab
        run: |
          mv target/x/release/android/gradle/app/build/outputs/bundle/debug/app-debug.aab target/x/localdesktop-${{ steps.extract_version.outputs.version }}-debug.aab
          mv target/x/release/android/gradle/app/build/outputs/bundle/release/app-release.aab target/x/localdesktop-${{ steps.extract_version.outputs.version }}.aab

      - name: Prepare AAB artifact
        id: aab_artifact
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' && inputs.include_aab
        env:
          BASE: ${{ steps.apk_artifact.outputs.base }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          AAB_PATH="target/x/${BASE}-release.aab"
          cp "target/x/localdesktop-${VERSION}.aab" "$AAB_PATH"
          echo "path=${AAB_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload AAB
        if: steps.aab_artifact.outputs.path != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.aab_artifact.outputs.path }}
          if-no-files-found: error
          archive: false

      - name: Build User Manual PDFs
        if: github.ref_type == 'tag'
        run: |
          # All-Rust: Typst renders the PDF, the image crate handles webp — no
          # pandoc/LaTeX/Python, no apt packages needed. Six variants: every
          # size (desktop/fold/phone) × theme (light/dark).
          V="${{ steps.extract_version.outputs.version }}"
          for size in desktop fold phone; do
            for theme in light dark; do
              cargo run --release --bin build_docs -- user "$size" "$theme"
            done
          done
          # Rename build_docs' display names to versioned, dot-free release names
          # (GitHub turns spaces into dots in asset download URLs).
          cd manuals
          mv "Local Desktop - User Manual.pdf"               "Local-Desktop-v$V-User-Manual.pdf"
          mv "Local Desktop - User Manual (Dark).pdf"        "Local-Desktop-v$V-User-Manual-Dark.pdf"
          mv "Local Desktop - User Manual (Fold).pdf"        "Local-Desktop-v$V-User-Manual-Fold.pdf"
          mv "Local Desktop - User Manual (Fold, Dark).pdf"  "Local-Desktop-v$V-User-Manual-Fold-Dark.pdf"
          mv "Local Desktop - User Manual (Phone).pdf"       "Local-Desktop-v$V-User-Manual-Phone.pdf"
          mv "Local Desktop - User Manual (Phone, Dark).pdf" "Local-Desktop-v$V-User-Manual-Phone-Dark.pdf"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT }}
          name: Local Desktop v${{ steps.extract_version.outputs.version }}
          tag_name: v${{ steps.extract_version.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            target/x/localdesktop-${{ steps.extract_version.outputs.version }}.apk
            target/x/localdesktop-${{ steps.extract_version.outputs.version }}-debug.apk
            target/x/localdesktop-${{ steps.extract_version.outputs.version }}.aab
            target/x/localdesktop-${{ steps.extract_version.outputs.version }}-debug.aab
            manuals/Local-Desktop-v${{ steps.extract_version.outputs.version }}-User-Manual.pdf
            manuals/Local-Desktop-v${{ steps.extract_version.outputs.version }}-User-Manual-Dark.pdf
            manuals/Local-Desktop-v${{ steps.extract_version.outputs.version }}-User-Manual-Fold.pdf
            manuals/Local-Desktop-v${{ steps.extract_version.outputs.version }}-User-Manual-Fold-Dark.pdf
            manuals/Local-Desktop-v${{ steps.extract_version.outputs.version }}-User-Manual-Phone.pdf
            manuals/Local-Desktop-v${{ steps.extract_version.outputs.version }}-User-Manual-Phone-Dark.pdf
