name: Build APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

# Nothing below gets more than read access unless a job asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests and manual runs: no secrets, read-only token, nothing signed with the release key.
  # PR-controlled code (build.rs, Gradle scripts, xbuild patches) runs here, so it must stay unprivileged.
  build:
    name: Build (unprivileged)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Android build
        id: setup
        uses: ./.github/actions/setup-android-build

      # Without release-key.jks Gradle does not sign the release variant; the debug variant is
      # signed with Gradle's throwaway debug key, which is enough to install a PR build for testing.
      - name: Build APK
        run: x build --release --platform=android --arch=arm64 --format=apk

      - name: Collect APKs
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          find target/x/release/android/gradle/app/build/outputs/apk -name '*.apk' | while read -r apk; do
            variant=$(basename "$(dirname "$apk")")
            cp "$apk" "dist/localdesktop-${VERSION}-${SHA:0:7}-${variant}.apk"
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localdesktop-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  # Push to main and version tags only: the only job that can see the signing secrets.
  release:
    name: Build signed APK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release on tag pushes

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Android build
        id: setup
        uses: ./.github/actions/setup-android-build

      - name: Check tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      # All-Rust: Typst renders the PDF, the image crate handles webp — no
      # pandoc/LaTeX/Python, no apt packages needed. Six variants: every
      # size (desktop/fold/phone) × theme (light/dark). Built before the keystore exists on disk.
      - name: Build User Manual PDFs
        if: github.ref_type == 'tag'
        env:
          V: ${{ steps.setup.outputs.version }}
        run: |
          for size in desktop fold phone; do
            for theme in light dark; do
              cargo run --release --bin build_docs -- user "$size" "$theme"
            done
          done
          # Rename build_docs' display names to versioned, dot-free release names
          # (GitHub turns spaces into dots in asset download URLs).
          cd manuals
          mv "Local Desktop - User Manual.pdf"               "Local-Desktop-v$V-User-Manual.pdf"
          mv "Local Desktop - User Manual (Dark).pdf"        "Local-Desktop-v$V-User-Manual-Dark.pdf"
          mv "Local Desktop - User Manual (Fold).pdf"        "Local-Desktop-v$V-User-Manual-Fold.pdf"
          mv "Local Desktop - User Manual (Fold, Dark).pdf"  "Local-Desktop-v$V-User-Manual-Fold-Dark.pdf"
          mv "Local Desktop - User Manual (Phone).pdf"       "Local-Desktop-v$V-User-Manual-Phone.pdf"
          mv "Local Desktop - User Manual (Phone, Dark).pdf" "Local-Desktop-v$V-User-Manual-Phone-Dark.pdf"

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Signing secrets are not configured (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)" >&2
            exit 1
          fi
          mkdir -p target/x/release/android/gradle/app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > target/x/release/android/gradle/app/release-key.jks
          # Verify keystore
          keytool -list -keystore target/x/release/android/gradle/app/release-key.jks -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: x build --release --platform=android --arch=arm64 --format=apk

      - name: Remove signing keystore
        if: always()
        run: rm -f target/x/release/android/gradle/app/release-key.jks

      - name: Verify APK signature
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          mkdir -p dist
          cp target/x/release/android/gradle/app/build/outputs/apk/release/app-release.apk "dist/localdesktop-${VERSION}.apk"
          "$APKSIGNER" verify --print-certs "dist/localdesktop-${VERSION}.apk"
          sha256sum "dist/localdesktop-${VERSION}.apk" | tee "dist/localdesktop-${VERSION}.apk.sha256"

      - name: Upload signed APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localdesktop-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # Release notes come from the annotated tag message, falling back to the tagged commit message.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          object_type=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.type)
          if [ "$object_type" = "tag" ]; then
            tag_sha=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)
            gh api "repos/$REPO/git/tags/$tag_sha" --jq .message > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            git log -1 --pretty=%B > "$notes"
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Local Desktop Fold v$VERSION" \
            --notes-file "$notes" \
            "dist/localdesktop-${VERSION}.apk" \
            "dist/localdesktop-${VERSION}.apk.sha256" \
            manuals/Local-Desktop-v${VERSION}-User-Manual.pdf \
            manuals/Local-Desktop-v${VERSION}-User-Manual-Dark.pdf \
            manuals/Local-Desktop-v${VERSION}-User-Manual-Fold.pdf \
            manuals/Local-Desktop-v${VERSION}-User-Manual-Fold-Dark.pdf \
            manuals/Local-Desktop-v${VERSION}-User-Manual-Phone.pdf \
            manuals/Local-Desktop-v${VERSION}-User-Manual-Phone-Dark.pdf
